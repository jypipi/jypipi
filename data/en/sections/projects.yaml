- name: MBot Navigation Autonomy
  logo: /images/sections/projects/mbot-no-bkg.png
  image: /images/sections/projects/slam_block_diagram.png
  role: Robotics Software Engineer
  timeline: "Oct 2024 - Dec 2024"
