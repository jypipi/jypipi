degrees:
- name: Master of Science in Robotics
  icon: fa-graduation-cap
  timeframe: 2024-2026
  institution:
    name: University of Michigan, Ann Arbor
    url: "https://umich.edu"
    logo: images/sections/education/UM_Robotics_logo.jpg
    # Can optionally show a different logo for dark theme
    darkLogo: /images/sections/education/um_robotics_logo_light.png
  grade: #(optional)
    scale: GPA
    achieved: 3.94
    outOf: 4.0
  diploma: images/sections/education/MS_Robotics_Diploma.png
  takenCourses: #(optional)
    # if true, the courses will be rendered as a table otherwise it will render as a list and the grades will be hidden.
    showGrades: false
    collapseAfter: 5
    courses:
    - name: Mobile Robotics
    - name: Sensors, Data, and Smart Systems
    - name: Self Driving Cars
    - name: Deep Learning for Robot Perception
    - name: Action and Perception

